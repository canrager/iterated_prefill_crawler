# DeepSeek V3.2 on Ollama Cloud
#
# Cloud requires in .env:
#   OLLAMA_API_KEY=your_api_key
#
# Target model runs on Ollama Cloud. Auxiliary roles stay on OpenRouter.
# For local Ollama, remove provider_urls to use the default localhost.
#
# Usage:
#   ./scripts/run.sh model=ds-v32_ollama crawler=debug prompts=jailbreak

default_provider: "openrouter"

# Target via Ollama (cloud or local depending on provider_urls)
target_model: "ollama:deepseek-v3.2:cloud"

# Auxiliary roles via OpenRouter
translation_model: "qwen/qwen3-235b-a22b-2507"
summarization_model: "moonshotai/kimi-k2-0905"
refusal_check_model: "google/gemma-4-26b-a4b-it"
refusal_classifier_model: "ProtectAI/distilroberta-base-rejection-v1"

# No local vLLM needed
local_model: null
device: "auto"
cache_dir: "hf_models"
quantization_bits: null
vllm_tensor_parallel_size: 2
vllm_gpu_memory_utilization: 0.8
vllm_max_model_len: 4096

# Point Ollama to cloud (remove this block for local Ollama)
provider_urls:
  ollama: "https://ollama.com/v1"

# Ollama Cloud queues rather than 429s, but throughput plateaus above ~5.
provider_max_concurrency:
  ollama: 5
